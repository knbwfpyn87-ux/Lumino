# Builds Lumino and publishes the finished website to the `gh-pages` branch on every push to main.
# Works with Pages set to "Deploy from a branch" -> main (/ root): the built site is also saved to site/ on main,
# and index.html forwards github.io visitors there. (Branch gh-pages works too.)
# Optional: Settings -> Secrets and variables -> Actions: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_LIVEKIT_URL.
name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LIVEKIT_URL: ${{ secrets.VITE_LIVEKIT_URL }}
          # AI stays hidden until launch: add a repository variable VITE_ENABLE_AI = true to turn it on
          VITE_ENABLE_AI: ${{ vars.VITE_ENABLE_AI }}
          # Mr. Lumino's ElevenLabs voice: add a repository variable VITE_CLOUD_VOICE = on after the tts function is deployed
          VITE_CLOUD_VOICE: ${{ vars.VITE_CLOUD_VOICE }}
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll                      # serve files as-is (no Jekyll processing)
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Save the built site to site/ on main (for Pages deploy-from-main)
        run: |
          rm -rf site && cp -r dist site && rm -rf site/.git && touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site .nojekyll
          if git diff --cached --quiet; then echo "site/ unchanged"; exit 0; fi
          git commit -q -m "Publish site for ${GITHUB_SHA::7} [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
